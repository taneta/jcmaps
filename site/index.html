<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JC Maps</title>
<meta name="description" content="What is happening in Jersey City today, tomorrow or this weekend.">
<meta name="theme-color" content="#F3F0EA">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css">
<style>
  /* Design tokens: docs/design.md says what each is for. No color appears outside this block. */
  :root {
    color-scheme: light; /* light even on a dark system: dark maps are hard to read */
    --surface: #FFFFFF; --surface-2: #F4F1EC;
    --ink: #1E1B17; --ink-2: #534D45; --ink-3: #736B61;
    --line: #EAE6E0; --line-strong: #958C81;
    --accent: #FFB627; --accent-edge: #B27200; --accent-tint: #FFF3D6; --on-accent: #1E1B17;
    --free-bg: #E3F0DA; --free-text: #2D6526;
    --kids-bg: #EDE7FA; --kids-text: #5A3DA6;
    --map-land: #F3F0EA; --map-water: #C9DAE3; --map-park: #DDE6D2; --map-building: #E8E3DA;
    --shadow-float: 0 0 0 1px rgb(30 27 23 / .06), 0 2px 4px rgb(30 27 23 / .12);
    --shadow-sheet: 0 0 0 1px var(--line), 0 -4px 24px rgb(30 27 23 / .10);
    --radius-md: 12px; --radius-lg: 20px; --radius-pill: 999px;
    --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--map-land); color: var(--ink); font: 14px/1.45 var(--font);
    -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  #map { position: fixed; inset: 0; }

  /* Controls float over the map. Chips draw at 36px; ::before stretches the tap target to 44px. */
  .bar { position: fixed; top: 0; left: 0; right: 0; padding-top: env(safe-area-inset-top); display: flex; flex-direction: column; pointer-events: none; }
  .row { display: flex; gap: 8px; padding: 6px 12px; overflow-x: auto; scrollbar-width: none; scroll-padding-inline: 12px; pointer-events: auto; }
  .row:first-child { padding-top: 10px; }
  .row::-webkit-scrollbar { display: none; }
  .dates { display: none; } .dates.on { display: flex; }
  .chip, .seg { flex: 0 0 auto; display: inline-flex; align-items: center; height: 36px; border-radius: var(--radius-pill);
    background: var(--surface); box-shadow: var(--shadow-float); font-size: 14px; font-weight: 500; white-space: nowrap; }
  .chip { gap: 8px; padding: 0 14px; border: 0; cursor: pointer; }
  .chip, .seg button { position: relative; isolation: isolate; }
  .chip::before, .seg button::before { content: ""; position: absolute; inset: -4px 0; z-index: -1; }
  .seg { gap: 2px; padding: 3px; }
  .seg button { height: 30px; padding: 0 12px; border: 0; border-radius: var(--radius-pill); background: none; color: var(--ink-2); cursor: pointer; }
  .seg button::before { inset: -7px 0; }
  .chip[aria-pressed="true"], .seg [aria-pressed="true"] { background: var(--ink); color: var(--surface); }
  .chip input { height: 28px; margin-right: -8px; padding: 0; border: 0; background: none; font-size: 16px; appearance: textfield; } /* dates: the chip is their frame */
  #banner { display: none; margin: 6px 12px 0; padding: 10px 14px; border-radius: var(--radius-md); background: var(--ink);
    color: var(--surface); box-shadow: var(--shadow-float); pointer-events: auto; }
  #banner.on { display: block; }

  /* The sheet: the list that follows the map. */
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; height: 42vh; display: flex; flex-direction: column; background: var(--surface);
    border-radius: var(--radius-lg) var(--radius-lg) 0 0; box-shadow: var(--shadow-sheet); transition: height .2s ease; }
  .sheet.peek { height: 64px; } .sheet.full { height: 88vh; }
  .grip { position: absolute; top: 8px; left: 50%; width: 36px; height: 4px; margin-left: -18px; border-radius: var(--radius-pill);
    background: var(--line-strong); opacity: .5; }
  .handle { min-height: 56px; padding: 12px 16px 8px; display: flex; align-items: center; justify-content: space-between; gap: 12px;
    border-bottom: 1px solid var(--line); cursor: pointer; }
  .handle b { font-size: 16px; font-weight: 600; } .handle span { color: var(--ink-3); font-size: 13px; }
  .clear { flex: none; min-height: 44px; margin-right: -8px; padding: 0 8px; border: 0; background: none; color: var(--ink-2); font-size: 14px;
    font-weight: 600; cursor: pointer; } /* a text button: ink, never the event color */
  #list { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding-bottom: env(safe-area-inset-bottom); }
  .card { padding: 14px 16px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .card.sel { background: var(--accent-tint); }
  .card .when { display: flex; align-items: center; gap: 8px; color: var(--ink-2); font-size: 13px; font-weight: 600;
    font-variant-numeric: tabular-nums; }
  .card .mark { flex: none; display: grid; place-items: center; width: 20px; height: 20px; border-radius: var(--radius-pill);
    background: var(--accent); box-shadow: inset 0 0 0 1px var(--accent-edge); } /* the pin, in small, with the event's icon */
  .card .mark svg { width: 12px; height: 12px; fill: var(--on-accent); }
  .card h3 { margin: 2px 0 0; font-size: 16px; font-weight: 600; line-height: 1.3; }
  .card .where { margin-top: 2px; color: var(--ink-3); }
  .card .sum { margin-top: 6px; color: var(--ink-2); }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .tags:empty { display: none; }
  .tag { padding: 2px 9px; border-radius: var(--radius-pill); background: var(--surface-2); color: var(--ink-2); font-size: 12px; font-weight: 500; line-height: 18px; }
  .tag.free { background: var(--free-bg); color: var(--free-text); }
  .tag.kids { background: var(--kids-bg); color: var(--kids-text); }
  .tag.unknown { padding: 1px 8px; border: 1px dashed var(--line-strong); background: none; color: var(--ink-3); }
  .links { display: flex; gap: 20px; margin-top: 10px; font-size: 13px; font-weight: 500; }
  .links a { position: relative; color: var(--ink-2); text-decoration: underline; text-decoration-color: var(--line-strong); text-underline-offset: 3px; }
  .links a + a { color: var(--ink-3); }
  .links a::before { content: ""; position: absolute; inset: -12px -4px; }
  .links a:hover { color: var(--ink); text-decoration-color: currentColor; }
  .section { padding: 16px 16px 8px; background: var(--surface-2); color: var(--ink-3); font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
  .empty { padding: 32px 24px; color: var(--ink-3); text-align: center; }
  .note { padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--surface-2); color: var(--ink-3); font-size: 13px; } /* what Free left out */
  .foot { padding: 16px 16px 24px; color: var(--ink-3); font-size: 12px; }

  /* MapLibre's controls in the palette; on a phone they sit above the sheet, in thumb reach. */
  .maplibregl-ctrl-bottom-left, .maplibregl-ctrl-bottom-right { bottom: 42vh; }
  .maplibregl-ctrl-group, .maplibregl-ctrl-group:not(:empty) { border-radius: var(--radius-md); background: var(--surface); box-shadow: var(--shadow-float); }
  .maplibregl-ctrl-group button { width: 44px; height: 44px; border-radius: inherit; }
  .maplibregl-ctrl-group button + button { border-top: 0; }
  .maplibregl-ctrl-group button:focus:focus-visible { box-shadow: 0 0 0 2px var(--ink); }
  .maplibregl-ctrl-attrib.maplibregl-compact { background: var(--surface); color: var(--ink-3); box-shadow: var(--shadow-float); }
  .maplibregl-ctrl-attrib a { color: inherit; }

  @media (min-width: 900px) {
    .bar { right: 452px; }
    .sheet { left: auto; right: 16px; bottom: 16px; width: 420px; height: calc(100vh - 32px) !important; border-radius: var(--radius-lg); }
    .grip { display: none; }
    .maplibregl-ctrl-bottom-left { bottom: 0; }
    .maplibregl-ctrl-bottom-right { bottom: 6px; right: 452px; }
  }
  @media (prefers-reduced-motion: reduce) { .sheet { transition: none; } }
</style>
</head>
<body>
<div id="map" role="application" aria-label="Map of Jersey City events"></div>
<div class="bar">
  <div class="row" id="windows" role="group" aria-label="Time window">
    <button class="chip" data-w="today">Today</button>
    <button class="chip" data-w="tomorrow">Tomorrow</button>
    <button class="chip" data-w="weekend">Weekend</button>
    <button class="chip" data-w="custom">Dates</button>
  </div>
  <div class="row dates" id="dates">
    <label class="chip">From <input type="date" id="d1"></label>
    <label class="chip">To <input type="date" id="d2"></label>
  </div>
  <div class="row" role="group" aria-label="Filters">
    <div class="seg" id="view" role="group" aria-label="Who it suits">
      <button data-v="family" aria-pressed="true">Family</button>
      <button data-v="everyone" aria-pressed="false">Everyone</button>
    </div>
    <button class="chip" id="free" aria-pressed="false">Free</button>
  </div>
  <div id="banner" role="status"></div>
</div>
<div class="sheet" id="sheet">
  <div class="grip"></div>
  <div class="handle" id="handle"><b id="count">Loading…</b><span id="hint">tap to expand</span><button class="clear" id="clear" aria-label="Clear pin" hidden>Clear ×</button></div>
  <div id="list"></div>
</div>
<script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
