<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JC Maps</title>
<meta name="description" content="What is happening in Jersey City in the next few hours, tonight, tomorrow or this weekend.">
<meta name="theme-color" content="#1d4ed8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css">
<style>
  :root { --ink: #111827; --muted: #6b7280; --line: #e5e7eb; --accent: #1d4ed8; --bg: #fff; --chip: #f3f4f6; --warn: #fef3c7; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: var(--ink); background: var(--bg); }
  #map { position: fixed; inset: 0; }
  .bar { position: fixed; top: 0; left: 0; right: 0; padding: calc(8px + env(safe-area-inset-top)) 8px 8px; display: flex; flex-direction: column; gap: 6px; pointer-events: none; }
  .row { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; pointer-events: auto; padding: 2px; }
  .row::-webkit-scrollbar { display: none; }
  .chip { flex: 0 0 auto; min-height: 44px; padding: 0 14px; border: 1px solid var(--line); border-radius: 22px; background: var(--bg); color: var(--ink); font: inherit; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; box-shadow: 0 1px 3px rgba(0,0,0,.12); cursor: pointer; }
  .chip[aria-pressed="true"] { background: var(--accent); color: #fff; border-color: var(--accent); }
  .chip input { width: 3em; min-height: 32px; border: 1px solid var(--line); border-radius: 8px; font: inherit; text-align: center; }
  .dates { display: none; gap: 6px; pointer-events: auto; }
  .dates.on { display: flex; }
  .dates input { min-height: 44px; border: 1px solid var(--line); border-radius: 12px; font: inherit; padding: 0 8px; background: var(--bg); }
  #banner { display: none; margin: 0 2px; padding: 8px 12px; border-radius: 12px; background: var(--warn); font-size: 14px; pointer-events: auto; }
  #banner.on { display: block; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; height: 42vh; background: var(--bg); border-radius: 16px 16px 0 0; box-shadow: 0 -2px 12px rgba(0,0,0,.15); display: flex; flex-direction: column; transition: height .2s; }
  .sheet.peek { height: 64px; } .sheet.full { height: 88vh; }
  .handle { min-height: 44px; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 16px; cursor: pointer; border-bottom: 1px solid var(--line); }
  .handle b { font-size: 15px; } .handle span { color: var(--muted); font-size: 13px; }
  .clear { flex: none; min-height: 44px; margin-right: -8px; padding: 0 8px; border: 0; background: none; color: var(--accent); font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; }
  .grip { position: absolute; top: 6px; left: 50%; width: 36px; height: 4px; margin-left: -18px; border-radius: 2px; background: #d1d5db; }
  #list { overflow-y: auto; flex: 1; padding: 0 0 env(safe-area-inset-bottom); overscroll-behavior: contain; }
  .card { padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .card.sel { background: #eff6ff; }
  .card h3 { margin: 0 0 2px; font-size: 16px; line-height: 1.3; }
  .card .when { color: var(--accent); font-weight: 600; font-size: 14px; }
  .card .where, .card .sum { color: var(--muted); font-size: 14px; margin-top: 2px; }
  .card .sum { color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .tag { font-size: 12px; padding: 2px 8px; border-radius: 10px; background: var(--chip); color: #374151; }
  .tag.free { background: #dcfce7; color: #166534; } .tag.kids { background: #fce7f3; color: #9d174d; }
  .links { display: flex; gap: 16px; margin-top: 8px; font-size: 14px; }
  .links a { color: var(--accent); min-height: 32px; display: inline-flex; align-items: center; }
  .section { padding: 10px 16px; font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; background: #fafafa; }
  .empty { padding: 24px 16px; color: var(--muted); text-align: center; }
  .foot { padding: 12px 16px 20px; font-size: 12px; color: var(--muted); }
  .maplibregl-ctrl-bottom-left, .maplibregl-ctrl-bottom-right { bottom: 42vh; }
  .sel-pin { position: fixed; left: 8px; bottom: calc(42vh + 8px); z-index: 2; }
  @media (min-width: 900px) {
    .sheet { left: auto; right: 16px; bottom: 16px; width: 420px; height: calc(100vh - 32px) !important; border-radius: 16px; }
    .maplibregl-ctrl-bottom-left, .maplibregl-ctrl-bottom-right { bottom: 0; }
    .sel-pin { bottom: 16px; }
  }
</style>
</head>
<body>
<div id="map" role="application" aria-label="Map of Jersey City events"></div>
<div class="bar">
  <div class="row" id="windows" role="group" aria-label="Time window">
    <button class="chip" data-w="now">Now</button>
    <button class="chip" data-w="afternoon">Afternoon</button>
    <button class="chip" data-w="evening">Evening</button>
    <button class="chip" data-w="tomorrow">Tomorrow</button>
    <button class="chip" data-w="weekend">Weekend</button>
    <button class="chip" data-w="custom">Pick dates</button>
  </div>
  <div class="dates" id="dates">
    <input type="date" id="d1" aria-label="From date"> <input type="date" id="d2" aria-label="To date">
  </div>
  <div class="row" role="group" aria-label="Filters">
    <button class="chip" id="view" aria-pressed="true">Family</button>
    <button class="chip" id="free" aria-pressed="false">Free</button>
    <label class="chip">Age <input type="number" id="age" min="0" max="17" inputmode="numeric" aria-label="Child age"></label>
  </div>
  <div id="banner" role="status"></div>
</div>
<div class="sheet" id="sheet">
  <div class="grip"></div>
  <div class="handle" id="handle"><b id="count">Loading…</b><span id="hint">tap to expand</span><button class="clear" id="clear" aria-label="Clear pin" hidden>Clear ×</button></div>
  <div id="list"></div>
</div>
<script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
