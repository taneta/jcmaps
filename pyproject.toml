[project]
name = "jcmaps"
version = "0.1.0"
description = "Map of Jersey City events by time window"
requires-python = ">=3.12"
dependencies = [
    "icalendar>=6",
    "httpx>=0.27",
    "pydantic>=2.9",
    "openai>=1.100",
]

[project.scripts]
jcmaps = "pipeline.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
