name: build
on:
  schedule:
    - cron: "0 6,11 * * *" # 2am and 7am in Jersey City during daylight saving time, an hour earlier in winter
  workflow_dispatch:
  push:
    branches: [main]

# The bot never commits: the site is the state, artifacts hold logs and reports.
permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # The github-pages environment only deploys from main, and it holds the OPENAI_API_KEY secret.
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest -q

      - name: Build (pull the live data, fetch feeds, enrich, check, gate)
        id: build
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          JCMAP_MODEL: ${{ vars.JCMAP_MODEL }}
          JCMAP_EFFORT: ${{ vars.JCMAP_EFFORT }}
          JCMAP_COST_CAP_USD: ${{ vars.JCMAP_COST_CAP_USD }}
        run: |
          set +e
          uv run jcmaps build --pull
          echo "exit=$?" >> "$GITHUB_OUTPUT"

      - name: Keep the run report and model log for 90 days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-${{ github.run_id }}
          path: |
            reports/
            logs/
          retention-days: 90
          if-no-files-found: ignore

      - name: Open an issue when the gate fails or a source cannot be fetched or is empty
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SERVER: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          TODAY: ${{ github.run_started_at }}
        run: |
          python3 - <<'PY' > /tmp/issue.md || exit 0
          import json, os, sys
          run = f"{os.environ['SERVER']}/{os.environ['REPO']}/actions/runs/{os.environ['RUN_ID']}"
          try:
              r = json.load(open("site/data/report.json"))
          except FileNotFoundError:
              r = None
          if r:
              gate, srcs = r["gate"], r["sources"]
              failed = {s: v for s, v in srcs.items() if v.get("error")}
              empty = [s for s, v in srcs.items() if v.get("published", 0) == 0 and s not in failed]
              if gate["passed"] and not failed and not empty:
                  sys.exit(1)
          print(f"**Where:** pipeline · **Seen:** run report, {os.environ['TODAY']} ([run]({run}))\n")
          print("## What happens")
          if r is None:
              print("The build crashed before writing a report; the traceback is in the run log.")
          else:
              if not gate["passed"]:
                  print("The gate failed, so the last good snapshot stayed published:\n" + "\n".join(f"- {x}" for x in gate["reasons"]))
              for s, v in failed.items():
                  if v.get("state") == "degraded":
                      print(f"\nSource {s} could not be fetched ({v['error']}). Its last good events, fetched {v['carried_from']}, "
                            f"were carried forward ({v['published']} published); 24 hours after that fetch they are left out.")
                  else:
                      print(f"\nSource {s} could not be fetched ({v['error']}) and has nothing left to carry, "
                            "so it is left out until a fetch succeeds.")
              if empty:
                  print("\nSources that published zero events: " + ", ".join(empty))
              print("\n```json\n" + json.dumps({k: r.get(k) for k in ("sources", "drops", "geocode", "enrich", "pulled")}, indent=1) + "\n```")
          print("\n## What should happen\nA scheduled run publishes a snapshot that passes the gate, with every source fetched and non-empty.")
          print("\n## Cause\nUnknown yet. Start with the run log and the `run-" + os.environ["RUN_ID"] + "` artifact (report and model log).")
          print("\n## Plan\n1. Read the report and the log.\n2. Fix the adapter or the source; refreeze the fixture if a feed changed shape.\n3. Re-run the workflow.\nOut of scope: anything the report does not mention.")
          print("\n## Done when\n- [ ] a run publishes with the gate passed and every source fetched and non-empty")
          PY
          if [ -s /tmp/issue.md ]; then
            gh label create "auto:build" --force --color D93F0B --description "opened by the build" >/dev/null
            gh issue create --title "Build $(date -u +%Y-%m-%d) needs attention" --body-file /tmp/issue.md --label "auto:build"
          fi

      # Deploy even after a failed gate: site/data then still holds the pulled last good snapshot.
      - uses: actions/configure-pages@v5
        if: always()
      - uses: actions/upload-pages-artifact@v3
        if: always()
        with:
          path: site
      - id: deploy
        if: always()
        uses: actions/deploy-pages@v4
